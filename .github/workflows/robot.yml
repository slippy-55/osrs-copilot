name: GE robot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      ai:
        description: "AI picks: auto, none, quick or deep"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: ge-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python robot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AI_MODE: ${{ github.event.inputs.ai || 'auto' }}
      - name: Save results
        run: |
          git config user.name "ge-robot"
          git config user.email "ge-robot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Robot update"
          git pull --rebase
          git push
